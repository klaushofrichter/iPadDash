# The unit tests (iPadDashTests) in an iPad simulator, on every pull request and
# every push to main. `test` is a required check on main.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Unit tests
        run: ./test.sh

      - name: Test log
        if: failure()
        run: tail -100 build/test.log
